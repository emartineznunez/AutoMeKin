name: CI

on:
  push:
    branches: ["gh-pages"]
  pull_request:

env:
  BUNDLE_DEPLOYMENT: "false" # 👈 Forzamos globalmente a Bundler a apagar el modo deployment

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Agregamos este paso previo para eliminar el bloqueo estricto antes de configurar Ruby
      - name: Remove deployment freeze
        run: |
          rm -f Gemfile.lock
          bundle config unset deployment --local || true
          bundle config unset deployment --global || true

       Silber:
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true # 👈 Ya puedes volver a activarlo para que vaya rápido
          cache-version: 1

      - name: Build with Jekyll
        run: bundle exec jekyll build
